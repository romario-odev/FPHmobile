trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - '**'

pr:
  branches:
    include:
      - main
      - develop
schedules:
  - cron: "0 */4 * * *"
    displayName: A cada 4 horas
    branches:
      include:
        - main
        - develop
    always: true
pool:
  vmImage: 'windows-latest'

variables:
  nodeVersion: '18.x'
  # Configure estas variáveis como secrets no Azure DevOps (Library)
  USER_EMAIL: '$(USER_EMAIL)'
  USER_PASSWORD: '$(USER_PASSWORD)'

stages:
  - stage: Build
    displayName: 'Build and Test'
    jobs:
      - job: E2ETests
        displayName: 'Run E2E Tests'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)
            displayName: 'Install Node.js'

          - task: Npm@1
            inputs:
              command: 'install'
            displayName: 'Install Dependencies'

          - task: CmdLine@2
            displayName: 'Setup Android Environment'
            inputs:
              script: |
                echo "Installing Java"
                winget install Amazon.Corretto.17.JDK --accept-source-agreements --accept-package-agreements
                
                echo "Setting JAVA_HOME"
                setx JAVA_HOME "C:\Program Files\Amazon Corretto\jdk17.0.21_0"
                set JAVA_HOME=C:\Program Files\Amazon Corretto\jdk17.0.21_0
                
                echo "Java version:"
                java -version
                
                echo "Creating .env file"
                echo USER_EMAIL=$(USER_EMAIL) > .env
                echo USER_PASSWORD=$(USER_PASSWORD) >> .env
                
                echo "Android SDK should be pre-installed on windows-latest"
                echo %ANDROID_HOME%
                echo %ANDROID_SDK_ROOT%

          - task: CmdLine@2
            displayName: 'Run E2E Tests'
            inputs:
              script: 'npm run t'
            continueOnError: true

          - task: PublishTestResults@2
            displayName: 'Publish Test Results'
            condition: always()
            inputs:
              testResultsFiles: '**/results/reports/*.json'
              testRunTitle: 'E2E Test Results'
              mergeTestResults: true

          - task: PublishBuildArtifacts@1
            displayName: 'Publish Test Artifacts'
            condition: always()
            inputs:
              PathtoPublish: 'results'
              ArtifactName: 'test-results'
              publishLocation: 'Container'
